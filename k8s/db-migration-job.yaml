
apiVersion: batch/v1
kind: Job
metadata:
  name: fastapi-db-migration
  namespace: fastapi
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migration
          image: 812161114709.dkr.ecr.ap-south-1.amazonaws.com/fastapi-gitops:v4
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: fastapi-db-secret
